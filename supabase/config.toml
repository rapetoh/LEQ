# Supabase CLI configuration for LEQ (CLI 2.x).
# Keys follow https://supabase.com/docs/guides/local-development/cli/config
# Buckets and their policies are created by the migration, not declared here,
# so that there is one source of truth for storage.

project_id = "leq"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Production runs Postgres 17 (decision ADR-001).
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 15
max_client_conn = 200

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# The hosted site, where the public pages and the duel invitation live. `config push` writes this
# to the project, so it must be the real one and not the template's local address.
site_url = "https://leq-serveur.fly.dev"
additional_redirect_urls = ["https://127.0.0.1:3000", "http://127.0.0.1:3000", "leq://auth"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Diagnostic before account (decision 5): anonymous sign-in is on.
enable_anonymous_sign_ins = true
# Needed so an anonymous user can link Apple or Google to the same account.
enable_manual_linking = true
minimum_password_length = 8

[auth.email]
# The app verifies a six-digit code (verifyOtp), so every template carries {{ .Token }}.
[auth.email.template.email_change]
subject = "Ton code LEQ"
content_path = "./supabase/templates/changement-email.html"
[auth.email.template.magic_link]
subject = "Ton code LEQ"
content_path = "./supabase/templates/code-connexion.html"
[auth.email.template.confirmation]
subject = "Ton code LEQ"
content_path = "./supabase/templates/code-connexion.html"

enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"

# The code e-mails leave from LEQ's own address, hundreds a day, instead of Supabase's shared
# sender and its few per hour for the whole project. The app password lives in .env only.
[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
user = "join.leq@gmail.com"
pass = "env(SMTP_PASS)"
admin_email = "join.leq@gmail.com"
sender_name = "LEQ"

# Sign in with Apple, native: the bundle id is the whole configuration, no secret is involved.
[auth.external.apple]
enabled = true
client_id = "com.leqapp.mobile"
secret = ""

# Sign in with Google, native on iOS and OAuth on the web. Two client ids, web first: they are
# public by design and ship inside the app. The secret is the web client's and lives in .env.
# `skip_nonce_check`: the iOS SDK does not hand the app the nonce it used, so the token cannot be
# checked against one; Supabase documents this switch for exactly that case.
[auth.external.google]
enabled = true
client_id = "857353590307-uhltrjds3ksv3rrbi2jncf9v8j71i2f3.apps.googleusercontent.com,857353590307-o4m8tts8r2a2g6h6ti9nu65g88b3031j.apps.googleusercontent.com"
secret = "env(GOOGLE_WEB_CLIENT_SECRET)"
skip_nonce_check = true

[auth.rate_limit]
# Anonymous sign-ins per hour per IP.
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

# Custom access token hook: copies profils.role into claims.app_metadata.role.
# On the hosted project this must also be registered in the dashboard
# (Authentication > Hooks), see README.md.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/hook_jeton_acces"

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
