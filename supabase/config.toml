# Supabase CLI configuration for LEQ (CLI 2.x).
# Keys follow https://supabase.com/docs/guides/local-development/cli/config
# Buckets and their policies are created by the migration, not declared here,
# so that there is one source of truth for storage.

project_id = "leq"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Production runs Postgres 17 (decision ADR-001).
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000", "leq://auth"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Diagnostic before account (decision 5): anonymous sign-in is on.
enable_anonymous_sign_ins = true
# Needed so an anonymous user can link Apple or Google to the same account.
enable_manual_linking = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"

[auth.rate_limit]
# Anonymous sign-ins per hour per IP.
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

# Custom access token hook: copies profils.role into claims.app_metadata.role.
# On the hosted project this must also be registered in the dashboard
# (Authentication > Hooks), see README.md.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/hook_jeton_acces"

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
